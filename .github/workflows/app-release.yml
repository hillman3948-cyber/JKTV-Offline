name: Signed Android release

on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Validate tag and signing secrets
        id: version
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Tag must look like app-v1.2.3; got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ -z "$KEYSTORE_B64" || -z "$KEY_ALIAS" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo 'Configure all four Android signing secrets before publishing an app release.' >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease -PversionName='${{ steps.version.outputs.name }}' -PversionCode='${{ github.run_number }}'

      - name: Sign and verify APK
        id: sign
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/jktv-release.keystore"
          aligned="$RUNNER_TEMP/jktv-aligned.apk"
          apk="JKTV-v${VERSION}.apk"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$aligned"
          apksigner sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$apk" "$aligned"
          apksigner verify --verbose "$apk"
          sha256sum "$apk" > "$apk.sha256"
          checksum="$(cut -d ' ' -f1 "$apk.sha256")"
          printf '{\n  "packageName": "com.jktv.offline",\n  "versionName": "%s",\n  "versionCode": %s,\n  "apk": "%s",\n  "sha256": "%s"\n}\n' \
            "$VERSION" "$VERSION_CODE" "$apk" "$checksum" > app-version.json
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          rm -f "$keystore" "$aligned"

      - name: Publish signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          APK: ${{ steps.sign.outputs.apk }}
        run: |
          gh release create "app-v${VERSION}" "$APK" "$APK.sha256" app-version.json \
            --title "JKTV ${VERSION}" --generate-notes --prerelease
